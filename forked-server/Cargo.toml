[package]
name = "forked-server"
description = "Self-hostable HTTP server for forked: the same /v1 API as forked cloud, over SQLite or in-memory storage."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../README.md"

[dependencies]
forked-core = { workspace = true }
forked-api = { workspace = true }
forked-memory = { workspace = true }
forked-sqlite = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }
