<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <style>
    .n { transform-box: fill-box; transform-origin: center; }
    @keyframes cycle { 0% { opacity: 1 } 94% { opacity: 1 } 100% { opacity: 0 } }
    .cycle { animation: cycle 10s linear infinite; }

    @keyframes lmain { 0%,2% { stroke-dashoffset: 1 } 15% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }
    .lmain { stroke-dasharray: 1; stroke-dashoffset: 1; animation: lmain 10s linear infinite; }
    @keyframes lfork { 0%,24% { stroke-dashoffset: 1 } 34% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }
    .lfork { stroke-dasharray: 1; stroke-dashoffset: 1; animation: lfork 10s linear infinite; }

    @keyframes p1  { 0%,3%  { opacity: 0; transform: scale(.2) } 5%,100%  { opacity: 1; transform: scale(1) } }
    @keyframes p2  { 0%,6%  { opacity: 0; transform: scale(.2) } 8%,100%  { opacity: 1; transform: scale(1) } }
    @keyframes p3  { 0%,9%  { opacity: 0; transform: scale(.2) } 11%,100% { opacity: 1; transform: scale(1) } }
    @keyframes p4  { 0%,12% { opacity: 0; transform: scale(.2) } 14%,100% { opacity: 1; transform: scale(1) } }
    @keyframes p5  { 0%,15% { opacity: 0; transform: scale(.2) } 17%,100% { opacity: 1; transform: scale(1) } }
    .p1 { animation: p1 10s linear infinite; } .p2 { animation: p2 10s linear infinite; }
    .p3 { animation: p3 10s linear infinite; } .p4 { animation: p4 10s linear infinite; }
    .p5 { animation: p5 10s linear infinite; }

    @keyframes fx  { 0%,62% { opacity: 0; transform: scale(.2) } 66%,100% { opacity: 1; transform: scale(1) } }
    .fx { animation: fx 10s linear infinite; }

    @keyframes a1 { 0%,35% { opacity: 0; transform: scale(.2) } 37%,100% { opacity: 1; transform: scale(1) } }
    @keyframes a2 { 0%,39% { opacity: 0; transform: scale(.2) } 41%,100% { opacity: 1; transform: scale(1) } }
    @keyframes a3 { 0%,43% { opacity: 0; transform: scale(.2) } 45%,100% { opacity: 1; transform: scale(1) } }
    .a1 { animation: a1 10s linear infinite; } .a2 { animation: a2 10s linear infinite; }
    .a3 { animation: a3 10s linear infinite; }

    @keyframes tmain { 0%,17% { opacity: 0 } 20%,100% { opacity: 1 } }
    .tmain { animation: tmain 10s linear infinite; }
    @keyframes talt { 0%,45% { opacity: 0 } 48%,100% { opacity: 1 } }
    .talt { animation: talt 10s linear infinite; }
    @keyframes rew { 0%,55% { opacity: 0 } 60%,100% { opacity: 1 } }
    .rew { animation: rew 10s linear infinite; }

    @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
    .blink { animation: blink 2.4s ease-in-out infinite; }
  </style>

  <!-- panel -->
  <rect x="2" y="2" width="836" height="306" rx="18" fill="#0b0b12" stroke="#26263a" stroke-width="1.5"/>
  <circle cx="26" cy="26" r="4.5" fill="#ffffff" opacity="0.1"/>
  <circle cx="44" cy="26" r="4.5" fill="#ffffff" opacity="0.1"/>
  <circle cx="62" cy="26" r="4.5" fill="#ffffff" opacity="0.1"/>
  <text x="82" y="30" font-size="12" fill="#5b5b70">forked · session run-42</text>

  <g class="cycle">
    <!-- main lane -->
    <path class="lmain" d="M 80 110 H 480" stroke="#6366f1" stroke-width="2.5" opacity="0.5" pathLength="1" fill="none"/>
    <!-- fork curve -->
    <path class="lfork" d="M 290 110 C 350 110, 340 205, 400 205 H 600" stroke="#34d399" stroke-width="2.5" opacity="0.55" pathLength="1" fill="none"/>
    <!-- rewound (anchored) tail -->
    <g class="rew">
      <path d="M 480 110 H 700" stroke="#6366f1" stroke-width="2.5" opacity="0.15" stroke-dasharray="4 7" fill="none"/>
      <circle cx="610" cy="110" r="7" fill="#6366f1" opacity="0.22"/>
      <circle cx="700" cy="110" r="7" fill="#6366f1" opacity="0.22"/>
      <text x="712" y="88" font-size="12" fill="#5b5b70">rewound · anchored, never lost</text>
    </g>

    <!-- main commits -->
    <circle class="n p1" cx="80"  cy="110" r="9" fill="#6366f1"/>
    <circle class="n p2" cx="185" cy="110" r="9" fill="#6366f1"/>
    <circle class="n p3" cx="290" cy="110" r="9" fill="#6366f1"/>
    <circle class="n p4" cx="395" cy="110" r="9" fill="#6366f1"/>
    <g class="n p5">
      <circle cx="480" cy="110" r="11" fill="#818cf8" class="blink"/>
    </g>
    <!-- effect marker -->
    <g class="n fx">
      <circle cx="610" cy="130" r="5" fill="#f59e0b"/>
      <text x="624" y="134" font-size="12" fill="#d8a63f">effect: payment.charge, kept</text>
    </g>

    <!-- alt commits -->
    <circle class="n a1" cx="400" cy="205" r="9" fill="#34d399"/>
    <circle class="n a2" cx="500" cy="205" r="9" fill="#34d399"/>
    <g class="n a3">
      <circle cx="600" cy="205" r="11" fill="#6ee7b7" class="blink"/>
    </g>

    <!-- labels -->
    <text class="tmain" x="480" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#e4e4ef">main</text>
    <text class="talt" x="600" y="243" text-anchor="middle" font-size="14" font-weight="600" fill="#b7f3dc">alternative</text>
  </g>

  <text x="80" y="285" font-size="12" fill="#5b5b70">fork: one ref write · rewind: byte-exact · effects: replayed, never re-run</text>
</svg>
