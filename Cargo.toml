[workspace]
resolver = "2"
members = [
    "forked-api",
    "forked-core",
    "forked-memory",
    "forked-server",
    "forked-sqlite",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/clibequilibrium/forked"
rust-version = "1.85"

[workspace.dependencies]
forked-core = { path = "forked-core", version = "0.1.0" }
forked-api = { path = "forked-api", version = "0.1.0" }
forked-memory = { path = "forked-memory", version = "0.1.0" }
forked-sqlite = { path = "forked-sqlite", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
sha2 = "0.10"
thiserror = "2"
hex = "0.4"
pollster = "0.4"
